name: Build native contracts CI image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/ci/images/native-contracts/Dockerfile'
      - '.github/workflows/native-contracts-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: native-contracts-image
  cancel-in-progress: true

jobs:
  publish:
    name: Publish native contracts image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      # Publishes under the repository owner, lowercased as image names require, so forks get their own.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/native-contracts-ci
          tags: |
            type=raw,value=ubuntu-24.04
            type=sha,format=long,prefix=
          flavor: latest=false

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: tools/ci/images/native-contracts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
